[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "django-work-order-routing"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["Django>=6.1.1,<7"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-django>=4.9,<5", "ruff>=0.8,<1", "pip-audit>=2.7,<3"]
[tool.pytest.ini_options]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "work_orders.infrastructure.settings"
[tool.ruff]
line-length = 100
